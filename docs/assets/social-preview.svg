<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Retail Data Platform</title>
  <desc id="d">Data flow: API, web and dataset sources, Python ingestion, PostgreSQL, dbt, analytics dashboard, orchestrated by Airflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 76px; font-weight: 700; fill: #f8fafc; letter-spacing: -1.5px; }
    .tagline { font-size: 27px; font-weight: 400; fill: #94a3b8; }
    .box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
    .label { font-size: 21px; font-weight: 600; fill: #f1f5f9; text-anchor: middle; }
    .sub { font-size: 16px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
    .band { fill: none; stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 7 6; }
    .band-label { font-size: 17px; font-weight: 500; fill: #7dd3fc; text-anchor: middle; letter-spacing: 0.4px; }
    .cap { font-size: 30px; font-weight: 600; fill: #7dd3fc; letter-spacing: 0.2px; }
    .tech { font-size: 23px; font-weight: 400; fill: #94a3b8; letter-spacing: 0.2px; }
    .rule { stroke: #1e293b; stroke-width: 2; }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="640" fill="#38bdf8"/>

  <!-- Title -->
  <text x="80" y="150" class="title">Retail Data Platform</text>
  <text x="80" y="198" class="tagline">End-to-end data engineering on a deliberately small workload</text>

  <!-- Pipeline: 5 boxes, 200 wide, 30 gap, starting at x=80 -->
  <g>
    <rect class="box" x="80" y="248" width="200" height="96" rx="12"/>
    <text class="label" x="180" y="288">Sources</text>
    <text class="sub" x="180" y="318">API · Web · Dataset</text>

    <rect class="box" x="310" y="248" width="200" height="96" rx="12"/>
    <text class="label" x="410" y="288">Python ingestion</text>
    <text class="sub" x="410" y="318">contract + quality gate</text>

    <rect class="box" x="540" y="248" width="200" height="96" rx="12"/>
    <text class="label" x="640" y="288">PostgreSQL</text>
    <text class="sub" x="640" y="318">raw · ops · marts</text>

    <rect class="box" x="770" y="248" width="200" height="96" rx="12"/>
    <text class="label" x="870" y="288">dbt</text>
    <text class="sub" x="870" y="318">models + tests</text>

    <rect class="box" x="1000" y="248" width="200" height="96" rx="12"/>
    <text class="label" x="1100" y="288">Analytics</text>
    <text class="sub" x="1100" y="318">Dashboard</text>
  </g>
  <g stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="284" y1="296" x2="306" y2="296"/>
    <line x1="514" y1="296" x2="536" y2="296"/>
    <line x1="744" y1="296" x2="766" y2="296"/>
    <line x1="974" y1="296" x2="996" y2="296"/>
  </g>

  <!-- Airflow orchestrates ingestion -> dbt -->
  <rect class="band" x="310" y="368" width="660" height="40" rx="10"/>
  <text class="band-label" x="640" y="394">Orchestrated by Apache Airflow</text>

  <line class="rule" x1="80" y1="462" x2="1200" y2="462"/>

  <!-- Capabilities + stack -->
  <text x="80" y="528" class="cap">Data Quality · Observability · CI/CD · Azure</text>
  <text x="80" y="578" class="tech">Python · PostgreSQL · dbt · Airflow · Docker · Azure</text>
</svg>
